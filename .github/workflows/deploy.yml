name: Deploy
# Migrations run ONLY from here (CLAUDE.md). Staging on merge to main; production
# waits for a manual approval (GitHub Environment "production" with required reviewers).
on:
  push:
    branches: [main]
concurrency: deploy
jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DIRECT_URL: ${{ secrets.STAGING_MIGRATE_URL }}   # Supabase Session pooler string, owner login
      NEXT_PUBLIC_SUPABASE_URL: https://yhbmkvmmlhtnblswsgup.supabase.co
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Apply migrations to staging
        run: npm run db:deploy
      - name: Check RLS on staging
        run: npm run check:rls
      - name: Build and deploy the staging Worker
        run: |
          npx opennextjs-cloudflare build
          npx wrangler deploy
  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production   # manual approval gate lives on this environment
    env:
      DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Apply migrations to production
        run: npm run db:deploy
      - name: Check RLS on production
        run: npm run check:rls
